name: Tigerswap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Build Go packages
        run: |
          cd backend/go/api_gateway && go build -o api_gateway .
          cd backend/go/dex_aggregator && go build -o dex_aggregator .
          cd backend/go/dex_connectors && go build -o dex_connectors .
          
      - name: Build Frontend
        run: |
          cd frontend && npm install && npm run build
          
      - name: Run tests
        run: |
          echo "Running tests..."
          # Go tests
          cd backend && go test ./...
          # Frontend tests
          cd frontend && npm test
          
      - name: Build Rust packages
        run: |
          cd backend/rust && cargo build --release || true
          
      - name: Build C++ packages
        run: |
          cd backend/cpp && mkdir -p build && cd build && cmake .. && make || true