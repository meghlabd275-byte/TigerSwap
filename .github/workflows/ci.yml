name: Tigerswap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Build Go packages
        run: |
          cd api_gateway && go build ./...
          cd dex_aggregator && go build ./...
          cd dex_connectors && go build ./...
          
      - name: Build Frontend
        run: |
          cd frontend/web_nextjs && npm install && npm run build
          cd frontend/admin_panel && npm install && npm run build
          
      - name: Run tests
        run: |
          echo "Running tests..."
          # Add actual test commands here