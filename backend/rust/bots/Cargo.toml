[package]
name = "tigerswap-bots"
version = "1.0.0"
edition = "2021"
authors = ["TigerSwap Team <bots@tigerswap.io>"]
description = "Self-built trading bots for TigerSwap: market maker, grid, DCA, arbitrage, sniper, TWAP, rebalance and liquidation"
license = "MIT"

[lib]
name = "tigerswap_bots"
# rlib keeps the crate usable as a normal Rust dependency; cdylib exports the C
# ABI the Go control plane links against. The shared library is deliberate: the
# staticlib embeds LLVM bitcode, which Go's cgo linker rejects as a disallowed
# LTO section.
crate-type = ["rlib", "cdylib"]

[dependencies]
parking_lot = "0.12"
serde_json = "1"
