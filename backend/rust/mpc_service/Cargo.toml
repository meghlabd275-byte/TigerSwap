[package]
name = "tigerwallet-mpc"
version = "1.0.0"
edition = "2021"
authors = ["TigerWallet Team <team@tigerwallet.io>"]
license = "MIT"
description = "MPC (Multi-Party Computation) service for TigerWallet"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Cryptography
secp256k1 = { version = "0.28", features = ["recovery", "rand"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
rand = "0.8"

# Threshold signatures (Feldman VSS)
rug = "1.22"

# Networking
tonic = "0.10"
prost = "0.12"

# Data types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Configuration
config = "0.14"

# Async channels
crossbeam-channel = "0.5"

# Serialization
bytes = "1.5"

[build-dependencies]
tonic-build = "0.10"

[[bin]]
name = "mpc-service"
path = "src/main.rs"

[lib]
name = "tigerwallet_mpc"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
