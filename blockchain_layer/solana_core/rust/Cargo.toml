[package]
name = "tigerswap-solana-core"
version = "1.0.0"
edition = "2021"
authors = ["TigerSwap Team"]
description = "Production-ready Solana core with AMM, token program, and cross-chain support"
license = "MIT"

[dependencies]
# Crypto
sha2 = "0.10"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha256 = "0.1"
base58 = "0.2"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Random
rand = "0.8"

# Binary encoding
bincode = "1.3"
borsh = "1.3"

[dev-dependencies]
criterion = "0.5"

[lib]
name = "tigerswap_solana_core"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1