[package]
name = "tigerswap-advanced-oracle"
version = "1.0.0"
edition = "2021"
description = "Advanced Oracle System"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
rust_decimal = { version = "1.33", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
path = "src/lib.rs"