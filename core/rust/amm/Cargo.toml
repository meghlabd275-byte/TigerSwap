[package]
name = "tigerswap-amm"
version = "1.0.0"
edition = "2021"
authors = ["TigerSwap Team"]
description = "High-performance AMM engine with concentrated liquidity"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1