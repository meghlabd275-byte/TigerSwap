[package]
name = "analytics_service"
version = "1.0.0"
edition = "2021"
description = "TigerSwap Analytics Service - Production-Ready Rust Analytics"

[dependencies]
# Async
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Metrics
metrics = "0.21"

# Statistics
statrs = "0.18"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "analytics-service"
path = "src/main.rs"

[lib]
name = "analytics_service"
path = "src/lib.rs"