[package]
name = "tiger-dca-engine"
version = "1.0.0"
edition = "2021"
description = "Dollar-Cost Averaging Engine for TigerSwap"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
parking_lot = "0.12"
rust_decimal = { version = "1.33", features = ["serde"] }

[lib]
name = "tiger_dca_engine"
path = "src/lib.rs"

[[bin]]
name = "dca-engine"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
