[package]
name = "tigerswap-dex-router"
version = "1.0.0"
edition = "2021"
authors = ["TigerSwap Team"]
description = "High-performance DEX routing engine for TigerSwap"
license = "MIT"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking
reqwest = { version = "0.11", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Hash maps
rustc-hash = "1.1"
indexmap = "2.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "router_benchmark"
harness = false

[lib]
name = "tigerswap_dex_router"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
