[package]
name = "indexer_service"
version = "1.0.0"
edition = "2021"
description = "TigerSwap Indexer Service - Production-Ready Rust Block Indexer"

[dependencies]
# Crypto
secp256k1 = "0.28"
sha2 = "0.10"
sha3 = "0.10"
keccak = "0.1"
rlp = "0.3"

# Async
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Metrics
metrics = "0.21"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "indexer-service"
path = "src/main.rs"

[lib]
name = "indexer_service"
path = "src/lib.rs"