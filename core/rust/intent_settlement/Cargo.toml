[package]
name = "intent_settlement"
version = "1.0.0"
edition = "2021"
description = "TigerSwap Intent Settlement Network - Solver Staking and Rewards"

[dependencies]
# Async
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Metrics
metrics = "0.21"

# Hashing
blake3 = "1.5"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "intent-settlement"
path = "src/main.rs"

[lib]
name = "intent_settlement"
path = "src/lib.rs"