[package]
name = "tiger-limit-orders"
version = "1.0.0"
edition = "2021"
description = "High-performance on-chain limit order system for TigerSwap"

[dependencies]
tokio = { version = "1.35", features = ["sync", "rt"] }
serde = { version = "1.0", features = ["derive"] }
uint = "0.9"
primitive-types = "0.12"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }

[[bench]]
name = "order_matching"
harness = false