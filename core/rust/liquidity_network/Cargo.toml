[package]
name = "tigerswap-liquidity-network"
version = "1.0.0"
edition = "2021"
description = "Professional Liquidity Network"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
rust_decimal = { version = "1.33", features = ["serde"] }

[lib]
path = "src/lib.rs"