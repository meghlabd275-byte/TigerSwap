[package]
name = "tigerswap-matching-cluster"
version = "1.0.0"
edition = "2021"
description = "Distributed Matching Cluster for TigerSwap"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.22"
parking_lot = "0.12"
rust_decimal = { version = "1.33", features = ["serde"] }

# Raft consensus
raft = "0.10"

# Networking
tonic = "0.10"
prost = "0.12"
hyper = "1.2"

# Protobuf
[build-dependencies]
tonic-build = "0.10"