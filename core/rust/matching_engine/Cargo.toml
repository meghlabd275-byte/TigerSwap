[package]
name = "matching_engine"
version = "1.0.0"
edition = "2021"
description = "TigerSwap Distributed Matching Engine - High Performance Order Matching"

[dependencies]
# Async
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Metrics
metrics = "0.21"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "matching-engine"
path = "src/main.rs"

[lib]
name = "matching_engine"
path = "src/lib.rs"