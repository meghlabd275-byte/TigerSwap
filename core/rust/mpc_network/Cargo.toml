[package]
name = "mpc_network"
version = "1.0.0"
edition = "2021"
description = "TigerSwap MPC Network - Production-Ready Distributed Key Management"

[dependencies]
# Cryptography
secp256k1 = "0.28"
sha2 = "0.10"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
x25519-dalek = "1.2"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1.6", features = ["derive"] }

# Networking
tokio = { version = "1.32", features = ["full"] }
tonic = "0.11"
prost = "0.12"
tower = "0.4"
hyper = "1.1"
http-body = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Async
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

[dev-dependencies]
tokio-test = "0.4"
quickcheck = "1.0"

[[bin]]
name = "mpc-node"
path = "src/main.rs"

[lib]
name = "mpc_network"
path = "src/lib.rs"