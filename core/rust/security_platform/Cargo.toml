[package]
name = "security_platform"
version = "1.0.0"
edition = "2021"
description = "TigerSwap Security Platform - Runtime Threat Detection and Transaction Firewall"

[dependencies]
# Crypto
secp256k1 = "0.28"
sha2 = "0.10"
keccak = "0.1"

# Async
tokio = { version = "1.32", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Metrics
metrics = "0.21"

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "security-platform"
path = "src/main.rs"

[lib]
name = "security_platform"
path = "src/lib.rs"