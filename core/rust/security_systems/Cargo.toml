[package]
name = "tigerswap-security-systems"
version = "1.0.0"
edition = "2021"
description = "Security Systems for Tier-1 DEX"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
rust_decimal = { version = "1.33", features = ["serde"] }

[lib]
path = "src/lib.rs"