[package]
name = "tigerswap-trading-engine"
version = "1.0.0"
edition = "2021"
authors = ["TigerSwap Team"]
description = "High-performance Trading Engine for TigerSwap DEX"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Cryptography
sha2 = "0.10"
rand = "0.8"

# Numbers
rust_decimal = { version = "1.33", features = ["serde", "serde-with-str"] }
num-bigint = "0.4"
num-traits = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
parking_lot = "0.12"

# Optimization
ahash = "0.8"

# Decimal macros
rust_decimal_macros = "1.33"

[dev-dependencies]

[lib]
name = "tigerswap_trading_engine"
path = "src/lib.rs"