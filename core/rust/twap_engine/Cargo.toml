[package]
name = "tigerswap-twap-engine"
version = "1.0.0"
edition = "2021"
authors = ["TigerSwap Team"]
description = "High-performance TWAP/DCA execution engine for TigerSwap"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "tigerswap_twap_engine"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true