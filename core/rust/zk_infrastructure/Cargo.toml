[package]
name = "zk_infrastructure"
version = "1.0.0"
edition = "2021"
description = "TigerSwap ZK Infrastructure - Production-Ready Zero-Knowledge Proofs"

[dependencies]
# Cryptography
curve25519-dalek = { version = "4.0", features = ["rand_core", "scalar_digest"] }
jubjub = "0.4"
blake2 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
keccak = "0.1"
rand = "0.8"
zeroize = { version = "1.6", features = ["derive"] }

# Elliptic Curve Pairings
pairing = "0.9"
bellman = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async
tokio = { version = "1.32", features = ["full"] }

# Metrics
metrics = "0.21"

[dev-dependencies]
quickcheck = "1.0"

[[bin]]
name = "zk-prover"
path = "src/main.rs"

[lib]
name = "zk_infrastructure"
path = "src/lib.rs"