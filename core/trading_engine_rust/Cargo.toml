[package]
name = "tigerswap-trading-engine"
version = "0.1.0"
edition = "2021"
authors = ["TigerSwap Team"]
description = "TigerSwap Trading Engine - Security Critical Components"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.6"

[features]
default = []
test-utils = []

[lib]
name = "tigerswap_trading_engine"
path = "src/lib.rs"

[[bin]]
name = "tigerswap-cli"
path = "src/main.rs"
required-features = ["test-utils"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1