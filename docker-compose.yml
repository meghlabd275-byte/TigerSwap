# Local/production-shaped deployment for the TigerSwap API and frontend.
#
# The database is Postgres and is required: the API has no DB defaults, by
# design. Supply secrets through a .env file next to this compose file (see
# .env.example) rather than committing them.
#
#   cp .env.example .env   # then edit .env
#   docker compose up --build
#
# The API runs its GORM AutoMigrate on startup, so the schema is created on the
# first boot. For a production database prefer a reviewed migration step over
# AutoMigrate.
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published by default; the API reaches it over the compose network.
    expose:
      - "5432"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database connection. DB_HOST points at the compose service name.
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      # The compose Postgres is not TLS-enabled, so the in-network connection
      # uses disable. Point this at a TLS-enabled database in production.
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # Auth and signing secrets.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY:-}
      WALLET_HD_SEED: ${WALLET_HD_SEED:-}
      PLATFORM_SIGNER_KEY: ${PLATFORM_SIGNER_KEY:-}
      # First-boot operator account.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Browser origins permitted to call the API with credentials.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      # Chains the deposit watcher scans.
      DEPOSIT_WATCH_CHAINS: ${DEPOSIT_WATCH_CHAINS:-}
      # Settlement chain for perps/margin/OTC escrow.
      TIGERSWAP_DEFAULT_CHAIN: ${TIGERSWAP_DEFAULT_CHAIN:-}
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db-data:
