# TigerSwap Production Infrastructure
# Kubernetes manifests for deployment

---
# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigerswap-api-gateway
  namespace: tigerswap
  labels:
    app: tigerswap-api-gateway
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tigerswap-api-gateway
  template:
    metadata:
      labels:
        app: tigerswap-api-gateway
        tier: api
    spec:
      containers:
      - name: api-gateway
        image: tigerswap/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        env:
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tigerswap-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: tigerswap-config
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: tigerswap-secrets
              key: jwt-secret
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/tigerswap
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: tigerswap-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: tigerswap-api-gateway
              topologyKey: kubernetes.io/hostname

---
# API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: tigerswap-api-gateway
  namespace: tigerswap
  labels:
    app: tigerswap-api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8443
    protocol: TCP
    name: https
  selector:
    app: tigerswap-api-gateway

---
# API Gateway HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tigerswap-api-gateway-hpa
  namespace: tigerswap
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tigerswap-api-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
# Indexer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigerswap-indexer
  namespace: tigerswap
  labels:
    app: tigerswap-indexer
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tigerswap-indexer
  template:
    metadata:
      labels:
        app: tigerswap-indexer
        tier: backend
    spec:
      containers:
      - name: indexer
        image: tigerswap/indexer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9090
          name: metrics
        env:
        - name: CHAIN_ID
          value: "1"
        - name: RPC_URL
          valueFrom:
            secretKeyRef:
              name: tigerswap-secrets
              key: rpc-url
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tigerswap-secrets
              key: database-url
        - name: START_BLOCK
          value: "18000000"
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 50Gi

---
# Indexer Service
apiVersion: v1
kind: Service
metadata:
  name: tigerswap-indexer
  namespace: tigerswap
  labels:
    app: tigerswap-indexer
spec:
  clusterIP: None
  ports:
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: tigerswap-indexer

---
# Matching Engine Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigerswap-matching-engine
  namespace: tigerswap
  labels:
    app: tigerswap-matching-engine
    tier: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tigerswap-matching-engine
  template:
    metadata:
      labels:
        app: tigerswap-matching-engine
        tier: core
    spec:
      containers:
      - name: matching-engine
        image: tigerswap/matching-engine:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: grpc
        - containerPort: 9091
          name: metrics
        env:
        - name: PORT
          value: "8081"
        - name: LOG_LEVEL
          value: "debug"
        - name: ENABLE_METRICS
          value: "true"
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "8000m"
            memory: "16Gi"
        volumeMounts:
        - name: config
          mountPath: /etc/tigerswap
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: tigerswap-config
      nodeSelector:
        high-performance: "true"
      tolerations:
      - key: "high-performance"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

---
# Matching Engine Service
apiVersion: v1
kind: Service
metadata:
  name: tigerswap-matching-engine
  namespace: tigerswap
  labels:
    app: tigerswap-matching-engine
spec:
  clusterIP: None
  ports:
  - port: 8081
    targetPort: 8081
    name: grpc
  - port: 9091
    targetPort: 9091
    name: metrics
  selector:
    app: tigerswap-matching-engine

---
# WebSocket Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigerswap-websocket
  namespace: tigerswap
  labels:
    app: tigerswap-websocket
    tier: api
spec:
  replicas: 5
  selector:
    matchLabels:
      app: tigerswap-websocket
  template:
    metadata:
      labels:
        app: tigerswap-websocket
        tier: api
    spec:
      containers:
      - name: websocket
        image: tigerswap/websocket:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: ws
        - containerPort: 9092
          name: metrics
        env:
        - name: PORT
          value: "8082"
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: tigerswap-config
              key: redis-url
        - name: MAX_CONNECTIONS
          value: "10000"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

---
# WebSocket Service
apiVersion: v1
kind: Service
metadata:
  name: tigerswap-websocket
  namespace: tigerswap
  labels:
    app: tigerswap-websocket
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8082
    name: ws
  selector:
    app: tigerswap-websocket

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tigerswap-ingress
  namespace: tigerswap
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - api.tigerswap.io
    - app.tigerswap.io
    - ws.tigerswap.io
    secretName: tigerswap-tls
  rules:
  - host: api.tigerswap.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tigerswap-api-gateway
            port:
              number: 80
  - host: app.tigerswap.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tigerswap-web
            port:
              number: 80
  - host: ws.tigerswap.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tigerswap-websocket
            port:
              number: 80

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: tigerswap-config
  namespace: tigerswap
data:
  redis-url: "redis://tigerswap-redis:6379"
  log-level: "info"
  environment: "production"

---
# Secrets
apiVersion: v1
kind: Secret
metadata:
  name: tigerswap-secrets
  namespace: tigerswap
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/tigerswap"
  rpc-url: "https://eth-mainnet.example.com"
  jwt-secret: "your-jwt-secret-here"
  api-key: "your-api-key-here"

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tigerswap-api-gateway-pdb
  namespace: tigerswap
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: tigerswap-api-gateway

---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tigerswap-network-policy
  namespace: tigerswap
spec:
  podSelector:
    matchLabels:
      tier: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: api
    - podSelector:
        matchLabels:
          tier: core
  - from:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          tier: backend
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tigerswap-api-gateway-monitor
  namespace: tigerswap
spec:
  selector:
    matchLabels:
      app: tigerswap-api-gateway
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
  namespaceSelector:
    matchNames:
    - tigerswap

---
# PrometheusRule for alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tigerswap-alerts
  namespace: tigerswap
spec:
  groups:
  - name: tigerswap.rules
    rules:
    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High error rate on {{ $labels.service }}"
    - alert: HighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High latency on {{ $labels.service }}"
    - alert: PodMemoryUsage
      expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} memory usage above 90%"
