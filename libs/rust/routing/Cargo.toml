[package]
name = "tigerswap-routing"
version = "1.0.0"
edition = "2021"
authors = ["TigerSwap Team"]
description = "High-performance DEX routing engine for TigerSwap"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
ahash = "0.8"
rustc-hash = "1.1"
smallvec = { version = "1.13", features = ["union"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "routing_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"