[package]
name = "tiger-security"
version = "1.0.0"
edition = "2021"
authors = ["TigerSwap"]
license = "MIT"
description = "TigerSwap Security Module - Contract Verification and Audit Engine"

[dependencies]
# Cryptography
sha2 = "0.10"
sha3 = "0.10"
keccak = "0.1"
elliptic-curve = "0.13"
ecdsa = "0.14"
hex = "0.4"
base64 = "0.21"

# Byte handling
byteorder = "1.4"
bytes = "1.4"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Regex for pattern matching
regex = "1.9"

# Numeric operations
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
proptest = "1.2"
criterion = "0.5"

[[bench]]
name = "security_bench"
harness = false
