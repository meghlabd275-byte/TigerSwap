[package]
name = "tigerswap-mev-protection"
version = "1.0.0"
edition = "2021"
authors = ["TigerSwap Team"]
description = "MEV protection service for TigerSwap"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
thiserror = "1.0"
hex = "0.4"

[dev-dependencies]

[lib]
name = "tigerswap_mev_protection"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
