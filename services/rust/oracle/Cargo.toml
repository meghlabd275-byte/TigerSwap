[package]
name = "tigerswap-oracle"
version = "1.0.0"
edition = "2021"
description = "High-performance price oracle"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
ahash = "0.8"
tracing = "0.1"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3