specVersion: 1.0.0
description: TigerSwap Decentralized Exchange Subgraph
repository: https://github.com/tigerswap/subgraph
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum/contract
    name: TigerFactory
    network: mainnet
    source:
      address: '0x0000000000000000000000000000000000000001'
      abi: TigerFactory
      startBlock: 15000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.12
      language: wasm/assemblyscript
      entities:
        - PoolCreated
        - Factory
      abis:
        - name: TigerFactory
          file: ./abis/TigerFactory.json
      eventHandlers:
        - event: PoolCreated(address,address,uint24,int24,address)
          handler: handlePoolCreated
      file: ./src/factory.ts
  - kind: ethereum/contract
    name: TigerToken
    network: mainnet
    source:
      address: '0x0000000000000000000000000000000000000002'
      abi: TigerToken
      startBlock: 15000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.12
      language: wasm/assemblyscript
      entities:
        - Transfer
        - Approval
        - Token
      abis:
        - name: TigerToken
          file: ./abis/TigerToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
      file: ./src/token.ts
templates:
  - kind: ethereum/contract
    name: TigerPool
    network: mainnet
    source:
      abi: TigerPool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.12
      language: wasm/assemblyscript
      entities:
        - Swap
        - Mint
        - Burn
        - Sync
        - SetFeeProtocol
        - Collect
      abis:
        - name: TigerPool
          file: ./abis/TigerPool.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,indexed address)
          handler: handleSwap
        - event: Mint(indexed address,indexed address,uint256,uint256,int24,int24,uint128,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,indexed address,uint256,uint256,uint128,uint256,uint256)
          handler: handleBurn
        - event: Sync(uint160,uint128)
          handler: handleSync
        - event: Collect(indexed address,indexed address,uint256,uint256)
          handler: handleCollect
      file: ./src/pool.ts