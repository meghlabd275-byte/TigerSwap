[package]
name = "tigerswap-limit-orders"
version = "1.0.0"
edition = "2021"
description = "High-performance limit orders service"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
num-bigint = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[profile.release]
opt-level = 3